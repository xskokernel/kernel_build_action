name: 'Android Kernel Build Action'
description: "An action to build android kernel."

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  kernel-url:
    required: true
  depth:
    required: false
    default: 1
  vendor:
    required: false
    default: false
  vendor-url:
    required: false
  kernel-dir:
    required: false
    default: kernel
  vendor-dir:
    required: false
    default: vendor
  kernel-branch:
    required: false
    default: main
  vendor-branch:
    required: false
    default: main
  config:
    required: true
    default: defconfig
  arch:
    required: true
    default: arm64
  android-version:
    required: false
    default: ""
  ksu:
    required: false
    default: false
  rekernel:
    required: false
    default: false
  ksu-version:
    required: false
    default: "main"
  ksu-other:
    required: false
    default: false
  ksu-url:
    required: false
  ksu-lkm:
    required: false
    default: false
  disable-lto:
    required: false
    default: false
  lxc:
    required: false
    default: false
  lxc-patch:
    required: false
    default: false
  nethunter:
    required: false
    default: false
  nethunter-patch:
    required: false
    default: false
  kvm:
    required: false
    default: false
  ccache:
    required: false
    default: false
  aosp-gcc:
    required: false
    default: false
  other-gcc32-url:
    required: false
  other-gcc32-branch:
    required: false
    default: main
  other-gcc64-url:
    required: false
  other-gcc64-branch:
    required: false
    default: main
  aosp-clang:
    required: false
    default: false
  aosp-clang-version:
    required: false
    default: "r383902"
  other-clang-url:
    required: false
  other-clang-branch:
    required: false
    default: main
  anykernel3:
    required: false
    default: false
  anykernel3-url:
    required: false
  bootimg-url:
    required: false
  release:
    required: false
    default: false
  access-token:
    required: false
  extra-cmd:
    required: false

runs:
  using: 'composite'
  steps:

    - name: Setup ccache
      if: inputs.ccache == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ inputs.config }}-0cb68f9cbcbb3de9c966cf66ed51471fbe51419e
        max-size: 4G
        create-symlink: true

    - name: 准备流程
      shell: bash
      run: |
        #!/bin/bash
        mkdir kernel_workspace
        cd kernel_workspace
        mkdir drivers
        set -euo pipefail

        # Function to display error messages and exit
        error() {
            echo "Error: $1" >&2
            exit 1
        }

        # Function to run a command with sudo if not already root
        SU() {
            if [ "$(id -u)" -eq 0 ]; then
                "$@"
            else
                sudo "$@"
            fi
        }

        # Function to download and extract a file
        download_and_extract() {
            local url=$1
            local output_name=$2
            local extract_dir=$3
            local branch=${4:-main}

            mkdir -p -v "$extract_dir"
            case "$url" in
                *.zip)
                    aria2c -o "${output_name}.zip" "$url"
                    unzip -q "${output_name}.zip" -d "$extract_dir"
                    ;;
                *.tar.*|*.gz|*.xz|*.bz2)
                    aria2c -o "${output_name}.${url##*.}" "$url"
                    tar -C "$extract_dir" -xf "${output_name}.${url##*.}"
                    ;;
                *)
                    git clone --depth="${{ inputs.depth }}" -b "$branch" "$url" "$extract_dir"
                    ;;
            esac
        }

        # Check if the action is running on a Debian-based runner
        if [[ ${GITHUB_ACTIONS} != "true" || ${OSTYPE} != "linux-gnu" || ! -f /bin/apt ]]; then
            error "This action is intended for Debian-based runners."
        fi

        # Install dependencies
        echo "::group::Installing Building Depend Packages"
        SU apt-get update
        SU apt-get install --no-install-recommends -y \
            binutils git make bc bison openssl curl zip kmod cpio flex libelf-dev \
            libssl-dev libtfm-dev libc6-dev device-tree-compiler ca-certificates \
            python3 xz-utils aria2 build-essential ccache pigz coccinelle parallel
        echo "::endgroup::"

        # Download and set up the toolchain
        if [ "${{ inputs.aosp-clang }}" == "true" ]; then
            echo "::group::Downloading AOSP Clang"
            if [ "${{ inputs.aosp-gcc }}" != "true" ]; then
                error "AOSP GCC is required when using AOSP Clang."
            fi
            AOSP_CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/"
            if [ -n "${{ inputs.android-version }}" ]; then
                AOSP_CLANG_URL+="android${{ inputs.android-version }}-release/clang-${{ inputs.aosp-clang-version }}.tar.gz"
            else
                AOSP_CLANG_URL+="mirror-goog-main-llvm-toolchain-source/clang-${{ inputs.aosp-clang-version }}.tar.gz"
            fi
            download_and_extract "$AOSP_CLANG_URL" "aosp-clang" "$HOME/clang"
            echo "::endgroup::"
        elif [ -n "${{ inputs.other-clang-url }}" ]; then
            echo "::group::Downloading Third-party Clang"
            download_and_extract "${{ inputs.other-clang-url }}" "clang" "$HOME/clang" "${{ inputs.other-clang-branch }}"
            if [ ! -d "$HOME/clang/bin" ]; then
                # Move nested directories up if bin is not at the expected location
                for dir in "$HOME/clang"/*/*; do
                    if [ -d "$dir" ]; then
                        mv "$dir"/* "$HOME/clang/" 2>/dev/null || true
                        break
                    fi
                done
            fi
            if ! ls "$HOME/clang"/*-linux-* &>/dev/null; then
                echo "Binutils not found in clang directory. Downloading AOSP GCC"
                export NEED_GCC=1
            fi
            echo "::endgroup::"
        else
            SU apt-get install -y clang lld binutils-aarch64-linux-gnu binutils-arm-linux-gnuabeihf
        fi

        if [ "${{ inputs.aosp-gcc }}" == "true" ] || [ -n "${NEED_GCC:-}" ]; then
            echo "::group::Downloading AOSP GCC"
            if [ -n "${{ inputs.android-version }}" ]; then
                AOSP_GCC64_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
                AOSP_GCC32_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
                AOSP_GCC_BRANCH="android${{ inputs.android-version }}-release"
            else
                AOSP_GCC64_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
                AOSP_GCC32_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
            fi
            download_and_extract "$AOSP_GCC64_URL" "gcc-aarch64" "$HOME/gcc-64" "${AOSP_GCC_BRANCH:-main}"
            download_and_extract "$AOSP_GCC32_URL" "gcc-arm" "$HOME/gcc-32" "${AOSP_GCC_BRANCH:-main}"
            echo "::endgroup::"
        elif [ -n "${{ inputs.other-gcc64-url }}" ] || [ -n "${{ inputs.other-gcc32-url }}" ]; then
            echo "::group::Downloading Third-party GCC"
            if [ -n "${{ inputs.other-gcc64-url }}" ]; then
                download_and_extract "${{ inputs.other-gcc64-url }}" "gcc-aarch64" "$HOME/gcc-64" "${{ inputs.other-gcc64-branch }}"
            fi
            if [ -n "${{ inputs.other-gcc32-url }}" ]; then
                download_and_extract "${{ inputs.other-gcc32-url }}" "gcc-arm" "$HOME/gcc-32" "${{ inputs.other-gcc32-branch }}"
            fi
            echo "::endgroup::"
        fi

        if [ -d "$HOME/gcc-64" ]; then
            if [ ! -d "$HOME/gcc-64/bin" ]; then
                # Move nested directories up if bin is not at the expected location
                for dir in "$HOME/gcc-64"/*/*; do
                    if [ -d "$dir" ]; then
                        mv "$dir"/* "$HOME/gcc-64/" 2>/dev/null || true
                        break
                    fi
                done
            fi
        fi
        if [ -d "$HOME/gcc-32" ]; then
            if [ ! -d "$HOME/gcc-32/bin" ]; then
                # Move nested directories up if bin is not at the expected location
                for dir in "$HOME/gcc-32"/*/*; do
                    if [ -d "$dir" ]; then
                        mv "$dir"/* "$HOME/gcc-32/" 2>/dev/null || true
                        break
                    fi
                done
            fi
        fi

        # Clone the kernel source
        echo "::group::Pulling Kernel Source"
        git clone --recursive -b "${{ inputs.kernel-branch }}" --depth="${{ inputs.depth }}" "${{ inputs.kernel-url }}" "kernel/${{ inputs.kernel-dir }}"
        echo "::endgroup::"

        # Clone the vendor kernel source if specified
        git clone https://github.com/xskokernel/K34pure.git
        mv K34pure common 

        # Set up GCC-related variables
        if [ -d "$HOME/gcc-64/bin" ] || [ -d "$HOME/gcc-32/bin" ]; then
            for GCC_DIR in "$HOME/gcc-64" "$HOME/gcc-32"; do
                find "$GCC_DIR"/*/*/bin -type d -exec sh -c 'mv "$(dirname "$1")"/* "$2"/' _ {} "$GCC_DIR" \; -quit >/dev/null 2>&1 || true
                if [ -d "$GCC_DIR/bin" ]; then
                    for FILE in "$GCC_DIR/bin"/*; do
                        [ ! -e "$FILE" ] && continue
                        FILE_NAME=$(basename "$FILE")
                        MATCHED_DIR=""
                        while IFS= read -r FOLDER; do
                            FOLDER_NAME=$(basename "$FOLDER")
                            if [[ "$FILE_NAME" == "$FOLDER_NAME"* ]]; then
                                MATCHED_DIR="$FOLDER_NAME"
                                break
                            fi
                        done < <(find "$GCC_DIR" -mindepth 1 -maxdepth 1 -type d | sort -r)
                        if [ -n "$MATCHED_DIR" ]; then
                            case "$GCC_DIR" in
                                "$HOME/gcc-64") GCC64="$MATCHED_DIR" ;;
                                "$HOME/gcc-32") GCC32="$MATCHED_DIR" ;;
                            esac
                            break
                        fi
                    done
                fi
            done
        fi

        # Use Python3 version of mkdtboimg.py
        if [ -f scripts/dtc/libfdt/mkdtboimg.py ]; then
            if grep -q python2 scripts/Makefile.lib 2>/dev/null; then
                echo "::group::Using mkdtboimg Python3 version instead of Python2 version"
                rm -f scripts/dtc/libfdt/mkdtboimg.py
                cp -v "${{ github.action_path }}/mkdtboimg.py" scripts/dtc/libfdt/mkdtboimg.py
                echo "::endgroup::"
            elif grep -q scripts/ufdt scripts/Makefile.lib 2>/dev/null && [ ! -d scripts/ufdt ]; then
                mkdir -p ufdt/libufdt/utils/src
                cp -v "${{ github.action_path }}/mkdtboimg.py" ufdt/libufdt/utils/src/mkdtboimg.py
            fi
            if [ ! -f /usr/bin/python2 ]; then
                SU ln -sf /usr/bin/python3 /usr/bin/python2
            fi
        else
            echo "::group::Downloading mkdtboimg to /usr/local/bin"
            SU cp -v "${{ github.action_path }}/mkdtboimg.py" /usr/local/bin/mkdtboimg
            SU chmod +x /usr/local/bin/mkdtboimg
            echo "::endgroup::"
        fi

        # Initialize Kali NetHunter if enabled
        if [ "${{ inputs.nethunter }}" == "true" ]; then
            echo "::group::Initializing Kali NetHunter"
            cp -v "${{ github.action_path }}/nethunter/config.sh" nconfig.sh
            bash nconfig.sh "arch/${{ inputs.arch }}/configs/${{ inputs.config }}" -w
            if [ "${{ inputs.nethunter-patch }}" == "true" ]; then
                git apply "${{ github.action_path }}/nethunter/add-wifi-injection.patch"
                git apply "${{ github.action_path }}/nethunter/fix-ath9k-naming-conflict.patch"
                if [ "$PATCHLEVEL" -lt 19 ]; then
                    git apply "${{ github.action_path }}/nethunter/add-wifi-injection-4.14.patch"
                fi
            fi
            echo "::endgroup::"
        fi
    - name: 集成sukisu与susfs
      shell: bash
      run: |
        if [ ! -d "common" ]; then
    # 不存在则进入 kernel_workspace 目录
        cd kernel_workspace || { echo "进入 kernel_workspace 失败！目录不存在"; exit 1; }
        echo "已进入 kernel_workspace 目录"
        else
    # 存在则直接跳过
        echo "common 文件夹已存在，跳过操作"
        fi
        curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s susfs-main
            cd ./KernelSU
            # 获取当前 Git 提交的短哈希 (8位)
            GIT_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
            echo "当前提交哈希: $GIT_COMMIT_HASH"
            export KSU_VERSION=$KSU_VERSION
            # 尝试最多 3 次获取 KernelSU API 版本号
            for i in {1..3}; do
              # 从远程 Makefile 中提取 KSU_API_VERSION
              KSU_API_VERSION=$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/susfs-main/kernel/Makefile" | 
                # 查找第一个包含版本定义的行
                grep -m1 "KSU_VERSION_API :=" | 
                # 提取等号后的值
                awk -F'= ' '{print $2}' | 
                # 删除所有空白字符
                tr -d '[:space:]')
              # 如果成功获取到版本号则跳出循环，否则等待 1 秒后重试
              [ -n "$KSU_API_VERSION" ] && break || sleep 1
            done
            # 如果获取失败，使用默认版本号 3.1.7
            [ -z "$KSU_API_VERSION" ] && KSU_API_VERSION="3.1.7"
            # 将 API 版本号存储到 GitHub 环境变量
            echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV
            # 创建版本定义模板&版本格式函数: 使用获取的提交哈希和固定后缀
            # KSU_VERSION_API: API 版本定义
            # KSU_VERSION_FULL: 完整版本定义
            VERSION_DEFINITIONS=$'define get_ksu_version_full\nv\\$1-'"$GIT_COMMIT_HASH"$'@xsaq\nendef\n\nKSU_VERSION_API := '"$KSU_API_VERSION"$'\nKSU_VERSION_FULL := v'"$KSU_API_VERSION"$'-'"$GIT_COMMIT_HASH"$'@xsaq'
            # 清理内核 Makefile 中的旧版本定义
            # 删除版本函数
            sed -i '/define get_ksu_version_full/,/endef/d' kernel/Makefile
            # 删除 API 版本定义
            sed -i '/KSU_VERSION_API :=/d' kernel/Makefile
            # 删除完整版本定义
            sed -i '/KSU_VERSION_FULL :=/d' kernel/Makefile
            # 在 REPO_OWNER 行后插入新版本定义
            awk -v def="$VERSION_DEFINITIONS" '
              # 当找到 REPO_OWNER 行时，插入版本定义并设置标记
              /REPO_OWNER :=/ {print; print def; inserted=1; next}
              # 打印所有行
              1
              # 如果未找到插入点，在文件末尾追加
              END {if (!inserted) print def}
            ' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile

            # 生成自定义版本号（基于提交计数）, 失败时使用 114514
            KSU_VERSION=$(expr $(git rev-list --count main) + 10700 2>/dev/null || echo 114514)
            # 存储版本号到 GitHub 环境变量
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

            # 验证修改结果
            grep -A10 "REPO_OWNER" kernel/Makefile  # 检查插入点后的内容
            grep "KSU_VERSION_FULL" kernel/Makefile # 确认版本定义存在
            echo "SukiSU版本号: v${KSU_API_VERSION}-${GIT_COMMIT_HASH}@xsaq"    
            cd ..
            echo "正在添加SukiSU Ultra补丁..."
            git clone https://github.com/ShirkNeko/susfs4ksu.git -b kernel-4.14
            git clone https://github.com/ShirkNeko/SukiSU_patch.git
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cp ./SukiSU_patch/hooks/scope_min_manual_hooks_v1.5.patch ./common/
            cp ./SukiSU_patch/69_hide_stuff.patch ./common/
            cd ./common
            patch -p1 50_add_susfs_in_kernel-4.14.patch || true
            sleep 2
            patch -p1 < scope_min_manual_hooks_v1.5.patch || true
            sleep 2
            patch -p1 < 69_hide_stuff.patch || true
            sleep 2
            echo "CONFIG_KSU=y" >> ./common/arch/arm64/configs/phoenix_defconfig
            echo "CONFIG_KPM=y" >> ./common/arch/arm64/configs/phoenix_defconfig
            echo "正在开启manual/syscall钩子..."
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./common/arch/arm64/configs/phoenix_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./common/arch/arm64/configs/phoenix_defconfig
            echo "CONFIG_KSU_SUSFS=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          #添加对 Mountify (backslashxx/mountify) 模块的支持
          echo "CONFIG_TMPFS_XATTR=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> ./common/arch/arm64/configs/phoenix_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.aarch64
          echo "正在启用启用内核级基带保护支持…"
            cd kernel_workspace
            echo "CONFIG_BBG=y" >> ./common/arch/arm64/configs/phoenix_defconfig
            cd ./common/security
            wget https://github.com/cctv18/Baseband-guard/archive/refs/heads/master.zip
            unzip -q master.zip
            mv "Baseband-guard-master" baseband-guard
            printf '\nobj-$(CONFIG_BBG) += baseband-guard/\n' >> ./Makefile
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' ./Kconfig
            awk '
            /endmenu/ { last_endmenu_line = NR }
            { lines[NR] = $0 }
            END {
              for (i=1; i<=NR; i++) {
                if (i == last_endmenu_line) {
                  sub(/endmenu/, "", lines[i]);
                  print lines[i] "source \"security/baseband-guard/Kconfig\""
                  print ""
                  print "endmenu"
                } else {
                    print lines[i]
                }
              }
            }
            ' ./Kconfig > Kconfig.tmp && mv Kconfig.tmp ./Kconfig
            sed -i 's/selinuxfs.o //g' "./selinux/Makefile"
            sed -i 's/hooks.o //g' "./selinux/Makefile"
            cat "./baseband-guard/sepatch.txt" >> "./selinux/Makefile"
          
        - name: 构建内核
         shell: bash
         run: |
         echo "::group:: Building Kernel with selected cross compiler"
         EXTRA_CMD="${{ inputs.extra-cmd }}"
         if [[ -n "$EXTRA_CMD" && ! "$EXTRA_CMD" =~ ^[a-zA-Z0-9_=+./,\ -]*$ ]]; then
             echo "::error::extra-cmd contains invalid characters. Only letters, digits, _=+./,- and spaces are allowed." >&2
             exit 1
         fi
         read -r -a EXTRA_ARGS <<< "$EXTRA_CMD"
         EXTRA_ARG="${EXTRA_ARGS[@]}"
         mkdir out -p -v

         COMMAND="make -j$(nproc --all) ${{ inputs.config }} ARCH=${{ inputs.arch }} all $EXTRA_ARG O=out"

         if [ -d "$HOME/clang/bin" ]; then
              CMD_PATH="$HOME/clang/bin"
              CMD_CC="clang"
              if [ -d "$HOME/gcc-64/bin" ] || [ -d "$HOME/gcc-32/bin" ]; then
                  CMD_CROSS_COMPILE="$HOME/gcc-64/bin/${GCC64}-"
                  CMD_CROSS_COMPILE_ARM32="$HOME/gcc-32/bin/${GCC32}-"
                  CMD_CLANG_TRIPLE="aarch64-linux-gnu-"
              fi
         elif [ -d "$HOME/gcc-64/bin" ] || [ -d "$HOME/gcc-32/bin" ]; then
              CMD_PATH="$HOME/gcc-64/bin:$HOME/gcc-32/bin"
              if [ -n "${GCC64}" ]; then
                  CMD_CC="$HOME/gcc-64/bin/${GCC64}-gcc"
              else
                  CMD_CC="$HOME/gcc-32/bin/${GCC32}-gcc"
              fi
              CMD_CROSS_COMPILE="${GCC64}-"
              CMD_CROSS_COMPILE_ARM32="${GCC32}-"
              CMD_CLANG_TRIPLE="aarch64-linux-gnu-"
         else
              CMD_CC="/usr/bin/clang"
              CMD_CROSS_COMPILE="/usr/bin/aarch64-linux-gnu-"
              CMD_CROSS_COMPILE_ARM32="arm-linux-gnuabeihf-"
              CMD_CLANG_TRIPLE="aarch64-linux-gnu-"
         fi

         if [ ${{ inputs.ccache }} = true ]; then
              # enable ccache
              export USE_CCACHE=1
              export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

              # ensure /usr/lib/ccache is first inside CMD_PATH
              test -f /usr/bin/ccache && $SU rm -v /usr/bin/ccache
              CMD_PATH="/usr/lib/ccache:${CMD_PATH}"

              # verify compiler exist in /usr/lib/ccache
              if [ -d "${HOME}/clang/bin" ]; then
                  [ ! -e /usr/lib/clang ] && \
                      ln -s /usr/lib/clang /usr/bin/ccache
              else
                  if [ -n "${GCC64}" ]; then
                      [ ! -e "/usr/lib/${GCC64}-gcc" ] && \
                          ln -s "/usr/lib/${GCC64}-gcc" /usr/bin/ccache
                  else
                      [ ! -e "/usr/lib/${GCC32}-gcc" ] && \
                          ln -s "/usr/lib/${GCC32}-gcc" /usr/bin/ccache
                  fi
              fi
         fi

         # setup additional commands
         COMMAND+=" PATH=${CMD_PATH}:${PATH} CROSS_COMPILE=${CMD_CROSS_COMPILE} CROSS_COMPILE_ARM32=${CMD_CROSS_COMPILE_ARM32} CLANG_TRIPLE=${CMD_CLANG_TRIPLE} CC=${CMD_CC}"

         # run the command
         ${COMMAND}

         echo "::endgroup::"

         unset CMD_PATH CMD_CC CMD_CLANG_TRIPLE CMD_CROSS_COMPILE CMD_CROSS_COMPILE_ARM32 USE_CCACHE CLANG_TRIPLE CROSS_COMPILE_ARM32 CROSS_COMPILE CLANG_PATH HOMES KVER COMMAND SWAP_FILE SUBLEVEL PATCHLEVEL VERSION GCC_DIR FILE FILE_NAME MATCHED_DIR FOLDER FOLDER_NAME GCC64 GCC32 NEED_GCC AOSP_CLANG_URL OTHER_CLANG_URL AOSP_GCC64_URL AOSP_GCC32_URL AOSP_GCC_BRANCH OTHER_GCC64_URL OTHER_GCC32_URL EXTRA_CMD

        # Package the kernel output
        if [ "${{ inputs.anykernel3 }}" == "false" ]; then
            echo "::group::Packaging boot.img"

            # Validate bootimg-url is provided
            if [ -z "${{ inputs.bootimg-url }}" ]; then
                error "bootimg-url is required when anykernel3 is false"
            fi

            mkdir split
            cd split
            HOST_ARCH=$(dpkg --print-architecture)
            case "${HOST_ARCH}" in
                armv7*|armv8l|arm64|armhf|arm) aria2c https://github.com/Shubhamvis98/AIK/raw/4ac321dfd48e16344e6146c505708aa720ff0bb3/bin/magiskboot_arm -o magiskboot && chmod +x magiskboot ;;
                i*86|x86|amd64|x86_64) aria2c https://github.com/Shubhamvis98/AIK/raw/4ac321dfd48e16344e6146c505708aa720ff0bb3/bin/magiskboot_x86 -o magiskboot && chmod +x magiskboot ;;
                *) error "Unknown CPU architecture for this device!" ;;
            esac
            aria2c "${{ inputs.bootimg-url }}" -o boot.img || error "Failed to download boot.img"
            ./magiskboot unpack boot.img >/dev/null 2>&1 || error "Failed to unpack boot.img"
            rm -f kernel
            FMT=$(./magiskboot decompress < ../out/arch/${{ inputs.arch }}/boot/Image 2>/dev/null | head -n 1 | cut -d ' ' -f 2)
            if [ "$FMT" == "raw" ]; then
                if ! find ../out/arch/${{ inputs.arch }}/boot -name "Image" ! -name "*-*" -exec cp -v {} kernel \; 2>/dev/null; then
                    error "Failed to find kernel Image"
                fi
            else
                if [ -f dtb ]; then
                    if ! find ../out/arch/${{ inputs.arch }}/boot -name "Image.*-dtb" ! -name "*-*" -exec cp -v {} kernel \; 2>/dev/null; then
                        error "Failed to find kernel Image with dtb"
                    fi
                else
                    if ! find ../out/arch/${{ inputs.arch }}/boot -name "Image.*" ! -name "*-*" -exec cp -v {} kernel \; 2>/dev/null; then
                        error "Failed to find compressed kernel Image"
                    fi
                fi
            fi
            ./magiskboot repack boot.img || error "Failed to repack boot.img"
            rm -f boot.img
            mkdir -p ../../../build
            find . -name "*.img" -exec mv -v {} ../../../build/boot.img \;
            cd ..
            echo "::endgroup::"
        else
            echo "::group:: Packaging Anykernel3 flasher"
            if [ -n "${{ inputs.anykernel3-url }}" ]; then
                git clone "${{ inputs.anykernel3-url }}" AnyKernel3
            else
                git clone https://github.com/osm0sis/AnyKernel3
                sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' AnyKernel3/anykernel.sh
                sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
                sed -i 's/IS_SLOT_DEVICE=0;/IS_SLOT_DEVICE=auto;/g' AnyKernel3/anykernel.sh
            fi

            if [ -f out/arch/${{ inputs.arch }}/boot/Image.*-dtb ]; then
                if ! find out/arch/${{ inputs.arch }}/boot -name "Image.*-dtb" -exec cp -rv {} AnyKernel3/ \; 2>/dev/null; then
                    error "Failed to copy kernel Image with dtb"
                fi
            elif [ -f out/arch/${{ inputs.arch }}/boot/Image.* ]; then
                if ! find out/arch/${{ inputs.arch }}/boot -name "Image.*" ! -name "Image.*-dtb" -exec cp -rv {} AnyKernel3/ \; 2>/dev/null; then
                    error "Failed to copy compressed kernel Image"
                fi
            else
                if [ ! -f out/arch/${{ inputs.arch }}/boot/Image ]; then
                    error "Kernel Image not found"
                fi
                cp out/arch/${{ inputs.arch }}/boot/Image AnyKernel3/ -rv
            fi

            test -f out/arch/${{ inputs.arch }}/boot/dtbo.img && cp -v out/arch/${{ inputs.arch }}/boot/dtbo.img AnyKernel3/
            test -f out/arch/${{ inputs.arch }}/boot/dtb && cp -v out/arch/${{ inputs.arch }}/boot/dtb AnyKernel3/

            rm -rf -v AnyKernel3/.git* AnyKernel3/README.md
            mkdir -p -v ../../build
            if [ "${{ inputs.release }}" = "false" ]; then
                cp -r -v AnyKernel3/* ../../build
            else
                cd AnyKernel3 && zip -r Anykernel3-flasher.zip ./* && mv -v Anykernel3-flasher.zip .. && cd .. && mv -v Anykernel3-flasher.zip ../../build/
            fi
            echo "::endgroup::"
        fi

    - id: uploadi
      if: ${{ inputs.release == 'false' && inputs.anykernel3 == 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: kernel-built-bootimg
        path: build/*
        if-no-files-found: error
        overwrite: true

    - id: uploada
      if: ${{ inputs.release == 'false' && inputs.anykernel3 == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: Anykernel3-flasher
        path: build/*
        if-no-files-found: error
        overwrite: true

    - id: release
      if: inputs.release == 'true'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ inputs.access-token }}
      with:
        name: Last CI build kernel
        tag_name: last-ci-${{ github.sha }}
        files: build/*
        make_latest: true
        body: |
          Build Information:
          - Config: ${{ inputs.config }}
          - Branch: ${{ inputs.kernel-branch }}
          - Source: ${{ inputs.kernel-url }}
          - Architecture: ${{ inputs.arch }}

          Features:
          - KernelSU: ${{ inputs.ksu }}
          - NetHunter: ${{ inputs.nethunter }}
          - LXC: ${{ inputs.lxc }}
          - Docker: ${{ inputs.docker }}
          - KVM: ${{ inputs.kvm }}
          - Rekernel: ${{ inputs.rekernel }}

          Build Details:
          - Timestamp: ${{ github.event.repository.updated_at }}
          - Workflow: ${{ github.workflow }}
          - Run ID: ${{ github.run_id }}
          - Commit: ${{ github.sha }}
